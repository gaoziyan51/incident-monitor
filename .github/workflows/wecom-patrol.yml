name: wecom-patrol
on:
  schedule:
    - cron: '*/30 * * * *'   # 每30分钟巡检一轮（纯云端，不依赖本地电脑）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wecom-patrol
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patrol & push WeCom
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: node scripts/wecom-patrol.mjs

      - name: Commit patrol state
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "no state change, skip commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f data/wecom-patrol-state.json
            git commit -m "chore(data): update wecom patrol state $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
